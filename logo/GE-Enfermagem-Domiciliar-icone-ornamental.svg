<?xml version="1.0" encoding="UTF-8"?>
<!-- GE Enfermagem Domiciliar — ícone ornamentado (brasão), fundo transparente -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <title>GE Enfermagem Domiciliar — brasão</title>
  <defs>
    <linearGradient id="geMonoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F4C46"/>
      <stop offset="1" stop-color="#3E8E82"/>
    </linearGradient>
  </defs>

  <circle cx="160" cy="155" r="125" fill="none" stroke="#0F4C46" stroke-width="3"/>

  <!-- acento: telhado (lar) -->
  <path d="M135,80 L160,52 L185,80" fill="none" stroke="#0F4C46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- monograma -->
  <text x="160" y="205" text-anchor="middle" font-family="'Playfair Display','Bodoni MT','Didot',Georgia,'Times New Roman',serif" font-size="118" font-weight="700" letter-spacing="-16" fill="url(#geMonoGrad)">GE</text>

  <!-- acento: pulso (cuidado) -->
  <path d="M120,245 L142,245 L150,229 L160,259 L170,239 L178,245 L200,245" fill="none" stroke="#3E8E82" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- acento: ramo (acolhimento) -->
  <g>
    <line x1="98" y1="265" x2="72" y2="230" stroke="#3E8E82" stroke-width="2"/>
    <path d="M92,252 Q74,248 66,230 Q86,235 92,252 Z" fill="#7FBFA8"/>
    <path d="M78,235 Q62,230 55,214 Q72,220 78,235 Z" fill="#7FBFA8"/>
  </g>
</svg>
